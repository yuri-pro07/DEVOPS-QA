services:
  postgres:
    image: postgres:16
    container_name: gamificacao-postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_DB: gamificacao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamificacao_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      app_net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: gamificacao-pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_net

  app:
    build: .
    container_name: gamificacao-api-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
      conhecimento:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamificacao_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ML_URL: http://ml:8000
      CONHECIMENTO_URL: http://conhecimento:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sem-chave}
    ports:
      - "8080:8080"
    networks:
      - app_net

  ml:
    build: ./ml
    container_name: gamificacao-ml
    restart: always
    environment:
      PASTA_DOS_MODELOS: /models
    volumes:
      - ml_models:/models
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_net

  conhecimento:
    build: ./conhecimento
    container_name: gamificacao-conhecimento
    restart: always
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gamificacao-prometheus
    restart: always
    depends_on:
      - app
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gamificacao-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gamificacao.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app_net

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:
  ml_models:

networks:
  app_net:
    driver: bridge
