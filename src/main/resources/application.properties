spring.application.name=case-a-gamificacao-cursos

# Perfil padrao: h2 ao rodar local pela IDE.
# No Docker, a variavel SPRING_PROFILES_ACTIVE sobrescreve para "postgres".
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
