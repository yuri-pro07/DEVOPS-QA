spring.application.name=case-a-gamificacao-cursos

spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.gamificacao.ranking.consulta=true
management.metrics.distribution.percentiles-histogram.gamificacao.competencia.classificacao=true
management.metrics.distribution.slo.gamificacao.competencia.classificacao=2s

ml.url=${ML_URL:http://localhost:8001}
ml.timeout=${ML_TIMEOUT:2s}

conhecimento.url=${CONHECIMENTO_URL:http://localhost:8002}
conhecimento.timeout=${CONHECIMENTO_TIMEOUT:2s}

spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
ia.chave=${spring.ai.openai.api-key}
ia.modelo=${spring.ai.openai.chat.options.model}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
treinamento.fila.solicitacoes=treinamentos.solicitados
treinamento.fila.andamento=treinamentos.andamento
treinamento.reenvio.intervalo-ms=${TREINAMENTO_REENVIO_MS:10000}
treinamento.reenvio.carencia-segundos=5
